#dots i.on{background:var(--berry);transform:scale(1.5)}
.burst{position:fixed;pointer-events:none;font-size:26px;animation:burst .9s ease-out forwards;z-index:5}

function mkHead(her){const h=new T.Group(),e=new T.Group();sp(h,sk,.55,0,0,0);
 const hair=new T.Mesh(new T.SphereGeometry(.59,18,10,0,6.2832,0,1.75),hrm);hair.rotation.x=-.35;hair.position.y=.04;h.add(hair);

 const aL=arm(-1),aR=arm(1);sp(b,hrm,.17,-.22,.06,.12,1,.6,1.4);sp(b,hrm,.17,.22,.06,.12,1,.6,1.4);

{title:"Once upon a time…",text:"There were two people who had no idea they were about to change each other’s lives.",sky:"#ffd9e6",cam:[0,3.6,11,.9],

{title:"Then we met",text:"Write the day you met here: where you were, who said hi first, what you remember most.",sky:"#ffe0cc",cam:[-3,3.4,10.5,1],

{title:"Our first date",text:"Tell her about the little details: what you ordered, what you talked about, how nervous you were.",sky:"#fff0c9",cam:[0,4.6,10,1],

  const tb=new T.Mesh(new T.CylinderGeometry(1.7,1.7,.14,32),M(0xc98f6b));tb.position.y=1.5;const lg=new T.Mesh(new T.CylinderGeometry(.18,.3,1.5,12),M(0xb07a5a));lg.position.y=.75;g.add(tb,lg);
  [-.75,.75].forEach(x=>{const c=new T.Mesh(new T.CylinderGeometry(.3,.22,.42,16),M(0xffffff));c.position.set(x,1.78,0);g.add(c)});
  const sm=[...Array(6)].map(()=>sp(g,B(0xffffff),.13,0,0,0)),bl=[...Array(11)].map((_,k)=>sp(g,B(k%2?0xffd54a:0xff8fb1),.17,-6+k*1.2,5.2-1.1*Math.sin(k/10*3.1416),0)),hs=hearts(g,3);
  u.push(t=>{idle(a,t);idle(b,t+1);sm.forEach((s,k)=>{const f=(t*.5+k/6)%1,x=k%2?.75:-.75;s.position.set(x+Math.sin(f*9+k)*.1,2.1+f*1.4,0);s.scale.setScalar(1-f)});bl.forEach((o,k)=>o.scale.setScalar(1+.35*Math.sin(t*3+k)));hs.forEach((h,k)=>{const f=(t*.3+k/3)%1;h.position.set(Math.sin(f*6+k)*.4,2.6+f*3,0);sc(h,1-f*.5)})})}},
{title:"Adventures together",text:"Trips, road rides, silly nights in. Add the moments that make you both laugh when you remember them.",sky:"#cfeedd",cam:[5,3.2,10,.8],
 build(g,u){const gr=new T.Mesh(new T.BoxGeometry(60,.6,18),M(0xbfe8d2));gr.position.y=-.3;g.add(gr);const rd=new T.Mesh(new T.BoxGeometry(60,.1,3.4),M(0x7d6b7d));rd.position.y=.03;g.add(rd);

  const car=new T.Group();g.add(car);const body=new T.Mesh(new T.BoxGeometry(3.2,.75,1.5),M(0xff7aa8));body.position.y=.78;const cab=new T.Mesh(new T.BoxGeometry(1.6,.7,1.35),M(0xdff3ff,{transparent:true,opacity:.55}));cab.position.set(-.2,1.5,0);car.add(body,cab);
  [mkHead(0),mkHead(1)].forEach((h,k)=>{h.scale.setScalar(.5);h.position.set(-.65+k*.7,1.65,0);car.add(h)});
  const ws=[[-1,.75],[-1,-.75],[1,.75],[1,-.75]].map(([x,z])=>{const w=new T.Group();w.position.set(x,.4,z);const c=new T.Mesh(new T.CylinderGeometry(.4,.4,.26,16),M(0x4a2f45));c.rotation.x=1.5708;w.add(c);const s1=new T.Mesh(new T.BoxGeometry(.55,.07,.3),M(0xffd9e6)),s2=s1.clone();s2.rotation.z=1.5708;w.add(s1,s2);car.add(w);return w});

{title:"The big question",text:"Describe the moment you asked her, and the moment she said yes.",sky:"#ffe3f0",cam:[0,3.4,10.5,1.6],

  const ss=[...Array(8)].map(()=>spark(g,0,0,0)),dirs=[...Array(16)].map((_,k)=>{const y=1-2*(k+.5)/16,r=Math.sqrt(1-y*y),an=k*2.4;return new T.Vector3(Math.cos(an)*r,y,Math.sin(an)*r)});

   fw.forEach(f=>{const tt=(t*.7+f.k*.9)%2.4,r=tt*2.6;f.ps.forEach((s,k)=>{s.position.set(f.x+dirs[k].x*r,f.y+dirs[k].y*r-tt*tt*.4,f.z+dirs[k].z*r);s.scale.setScalar(Math.max(0,1-tt/2.4))})})})}},
{title:"And now, forever",text:"Thank you for being my home. I love you more every single day.",sky:"#ffc9dc",cam:[0,3.8,12,1.8],
 build(g,u){island(g,0xf7a8c4);const sun=new T.Mesh(new T.SphereGeometry(3.6,24,16),B(0xffb48a));sun.position.set(0,4,-8);g.add(sun);

const tex=(txt,w,h,bg,fg,sz=60)=>{const c=document.createElement('canvas');c.width=512;c.height=Math.round(512*h/w);const x=c.getContext('2d');x.fillStyle=bg;x.beginPath();if(x.roundRect)x.roundRect(0,0,c.width,c.height,c.height/2.2);else x.rect(0,0,c.width,c.height);x.fill();x.fillStyle=fg;const fs=s=>`600 ${s}px Fredoka,Trebuchet MS,sans-serif`;x.font=fs(sz);while(x.measureText(txt).width>c.width*.84&&sz>16){sz-=2;x.font=fs(sz)}x.textAlign='center';x.textBaseline='middle';x.fillText(txt,c.width/2,c.height/2+4);return new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true}))};

 sp(lid,M(gd),.3,0,.7,0);sp(lid,M(gd),.4,-.5,.64,0,1.3,.7,.9);sp(lid,M(gd),.4,.5,.64,0,1.3,.7,.9);
 lid.position.y=1.6;g.add(lid);g.userData.open=q=>{lid.position.set(q*1.4,1.6+q*3.4,0);lid.rotation.set(q*.3,0,-q*.7)};return g}

let mx=0,my=0,smx=0,smy=0;
const skyC=i=>new T.Color(STORY[i].sky).multiplyScalar(dark?.3:1);
function aim(){const c=STORY[cur].cam,f=Math.max(1,.9/cam.aspect),X=(STORY[cur].share??cur)*GAP;tp.set(X+c[0]*f,c[1]+(f-1)*1.2,c[2]*f);tl.set(X,c[3]-(cam.aspect<1?1.3:0),0)}
if(R){

 STORY.forEach((s,i)=>{if(s.share!=null){ups.push([]);return}const g=new T.Group(),u=[];g.position.x=i*GAP;S3.add(g);s.build(g,u);ups.push(u)});
